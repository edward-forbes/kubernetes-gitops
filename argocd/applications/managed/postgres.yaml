apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-local
  namespace: argocd
spec:
  project: local

  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: postgresql
      targetRevision: 18.8.13
      helm:
        valueFiles:
          - $values/environments/local/postgres-values.yaml

    - repoURL: https://github.com/edward-forbes/kubernetes-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true